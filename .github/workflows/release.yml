name: Gateway Release

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libaio-dev libssl-dev libsqlite3-dev zlib1g-dev

      - name: Verify internal contract digest
        run: cd proto && sha256sum --check SHA256SUMS

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGATEWAY_BUILD_TESTS=ON -DGATEWAY_BUILD_BENCHMARKS=ON

      - name: Build release
        run: cmake --build build --parallel $(nproc)

      - name: Run unit tests
        run: cd build && ctest --output-on-failure

      - name: Run benchmarks (smoke)
        run: ./build/test/benchmarks --benchmark_min_time=0.1s

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/gmorandi/scalaapi-gateway:${{ github.ref_name }}
            ghcr.io/gmorandi/scalaapi-gateway:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            io.scalaapi.commit-digest=${{ steps.meta.outputs.sha }}

      - name: Verify clean rebuild
        run: |
          echo "Verifying clean checkout can rebuild..."
          git clean -fdx
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGATEWAY_BUILD_TESTS=OFF -DGATEWAY_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel $(nproc)
          echo "Clean rebuild successful"

      - name: Generate release report
        run: |
          echo "## Gateway Release Report" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.meta.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ctest completed" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmarks: smoke test completed" >> $GITHUB_STEP_SUMMARY
          echo "- Image pushed: ghcr.io/gmorandi/scalaapi-gateway:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Skip reasons: none" >> $GITHUB_STEP_SUMMARY
