name: Gateway CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify internal contract digest
        run: cd proto && sha256sum --check SHA256SUMS

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libaio-dev libssl-dev libsqlite3-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGATEWAY_BUILD_TESTS=ON -DGATEWAY_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run unit tests
        run: cd build && ctest --output-on-failure

      - name: Run benchmarks (smoke)
        run: ./build/test/benchmarks --benchmark_min_time=0.1s

      - name: Generate report
        if: always()
        run: |
          echo "## Gateway CI Report" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ctest completed" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmarks: smoke test completed" >> $GITHUB_STEP_SUMMARY
          echo "- Skip reasons: none" >> $GITHUB_STEP_SUMMARY
